site_name: Стайлгайд «Сосны»
site_description: Правила написания и оформления документации сервиса бронирования загородных домиков «Сосны»
site_url: https://egorr-gubanov.github.io/style-guide-project/
repo_url: https://github.com/egorr-gubanov/style-guide-project
repo_name: egorr-gubanov/style-guide-project
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  !/templates/
theme:
  name: mkdocs
  locale: ru
nav:
  - О руководстве: index.md
  - Правила:
      - Стиль изложения: rules/voice.md
      - Терминология и интерфейс: rules/terminology.md
      - Орфография и значения: rules/notation.md
      - Структура документов: rules/structure.md
      - Оформление Markdown: rules/markdown.md
      - Изображения и примеры: rules/examples.md
      - Доступность текста: rules/accessibility.md
      - Достоверность сведений: rules/accuracy.md
      - Проверка и изменения: rules/review.md
  - Глоссарий: glossary.md
  - Шаблоны:
      - Пользовательская инструкция: templates/user-guide.md
      - Требования: templates/requirements.md
  - Примеры:
      - Заполнение формы: examples/booking.md
      - Проверка формы: examples/form-validation.md
  - Источники: references.md
plugins:
  - search:
      lang: ru
markdown_extensions:
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true
